{% extends 'admin_base.html' %}
{% load static %}
{% block content %}
<div class="page-inner py-4">
  <div class="card border-0 shadow-lg rounded-4">
    <div class="card-header bg-gradient-primary text-white d-flex align-items-center">
      <i class="fas fa-edit fa-lg me-2"></i>
      <h4 class="mb-0">Edit Subscription Plan</h4>
    </div>

    <div class="card-body px-4 py-4">
      <form id="editSubscriptionPlanForm">
        <div class="row g-4">
          <!-- Left Column -->
          <div class="col-md-6">
            <!-- Plan Name -->
            <div class="form-group mb-3">
              <label for="planName" class="form-label fw-semibold">Plan Name</label>
              <input type="text" class="form-control shadow-sm" id="planName" name="name" value="{{ plan.name }}" required>
            </div>

            <!-- Plan Type -->
            <div class="form-group mb-3">
              <label for="planType" class="form-label fw-semibold">Plan Type</label>
              <select class="form-select shadow-sm" id="planType" name="plan_type" required>
                <option value="free" {% if plan.plan_type == "free" %}selected{% endif %}>Free</option>
                <option value="premium" {% if plan.plan_type == "premium" %}selected{% endif %}>Premium</option>
              </select>
            </div>

            <!-- Price -->
            <div class="form-group mb-3">
              <label for="price" class="form-label fw-semibold">Price (₹)</label>
              <input type="number" class="form-control shadow-sm" id="price" name="price" min="0" step="0.01" value="{{ plan.price }}">
            </div>

            <!-- Duration -->
            <div class="form-group mb-3">
              <label for="durationDays" class="form-label fw-semibold">Duration (Days)</label>
              <input type="number" class="form-control shadow-sm" id="durationDays" name="duration_days" min="1" value="{{ plan.duration_days }}" required>
            </div>
          </div>

          <!-- Right Column -->
          <div class="col-md-6">
            <!-- Swipe Limit -->
            <div class="form-group mb-3">
              <label for="swipeLimit" class="form-label fw-semibold">Daily Swipe Limit 
                <small class="text-muted">(Leave empty for unlimited)</small>
              </label>
              <input type="number" class="form-control shadow-sm" id="swipeLimit" name="swipe_limit" value="{{ plan.swipe_limit|default:'' }}">
            </div>

            <!-- Features -->
            <div class="form-group mb-3">
              <label class="form-label fw-semibold">Features</label>
              <div id="featuresWrapper" class="rounded border p-3 bg-light-subtle">
                {% for feature in plan.features %}
                <div class="input-group mb-2 feature-item">
                  <input type="text" class="form-control" name="features[]" value="{{ feature }}" required>
                  <button type="button" class="btn btn-outline-danger btn-remove-feature">
                    <i class="fas fa-trash"></i>
                  </button>
                </div>
                {% endfor %}
                {% if not plan.features %}
                <div class="input-group mb-2 feature-item">
                  <input type="text" class="form-control" name="features[]" placeholder="Enter feature" required>
                  <button type="button" class="btn btn-outline-danger btn-remove-feature">
                    <i class="fas fa-trash"></i>
                  </button>
                </div>
                {% endif %}
              </div>
              <button type="button" class="btn btn-outline-primary btn-sm mt-2" id="addFeatureBtn">
                <i class="fas fa-plus me-1"></i>Add Feature
              </button>
            </div>

            <!-- Active Toggle -->
            <div class="form-check form-switch mt-4">
              <input class="form-check-input" type="checkbox" id="isActive" name="is_active" {% if plan.is_active %}checked{% endif %}>
              <label class="form-check-label fw-semibold" for="isActive">Active</label>
            </div>
          </div>
        </div>

        <div class="text-center mt-4">
          <button type="submit" class="btn btn-primary px-5 py-2 rounded-pill shadow-sm">
            <i class="fas fa-save me-2"></i>Update Plan
          </button>
        </div>
      </form>
    </div>
  </div>
</div>

<!-- Toastify -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css">
<script src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
<script src="https://kit.fontawesome.com/a076d05399.js" crossorigin="anonymous"></script>

<style>
  .bg-gradient-primary {
    background: linear-gradient(90deg, #007bff, #0056b3);
  }
  .form-label {
    color: #333;
  }
  .form-control, .form-select {
    border-radius: 0.6rem;
  }
  .feature-item input {
    border-top-right-radius: 0;
    border-bottom-right-radius: 0;
  }
  .btn-remove-feature {
    border-top-left-radius: 0;
    border-bottom-left-radius: 0;
  }
  .shadow-lg {
    box-shadow: 0 0.7rem 1.2rem rgba(0, 0, 0, 0.08) !important;
  }
</style>

<script>
  // CSRF helper
  function getCookie(name) {
    let cookieValue = null;
    if (document.cookie && document.cookie !== '') {
      const cookies = document.cookie.split(';');
      for (let i = 0; i < cookies.length; i++) {
        const cookie = cookies[i].trim();
        if (cookie.substring(0, name.length + 1) === (name + '=')) {
          cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
          break;
        }
      }
    }
    return cookieValue;
  }

  // Add / Remove Features dynamically
  document.getElementById("addFeatureBtn").addEventListener("click", function () {
    const wrapper = document.getElementById("featuresWrapper");
    const div = document.createElement("div");
    div.classList.add("input-group", "mb-2", "feature-item");
    div.innerHTML = `
      <input type="text" class="form-control" name="features[]" placeholder="Enter feature" required>
      <button type="button" class="btn btn-outline-danger btn-remove-feature"><i class="fas fa-trash"></i></button>
    `;
    wrapper.appendChild(div);
  });

  document.addEventListener("click", function(e){
    if(e.target.closest(".btn-remove-feature")){
      e.target.closest(".feature-item").remove();
    }
  });

  // Handle form submission via AJAX
  document.getElementById("editSubscriptionPlanForm").addEventListener("submit", async function(e){
    e.preventDefault();
    const formData = new FormData(this);

    try{
      const response = await fetch("", {
        method: "POST",
        headers: {
          "X-CSRFToken": getCookie("csrftoken"),
          "X-Requested-With": "XMLHttpRequest",
        },
        body: formData,
      });

      const data = await response.json();

      Toastify({
        text: data.message,
        duration: 3000,
        gravity: "top",
        position: "right",
        backgroundColor: data.status === "success" ? "#198754" : "#dc3545",
        close: true,
      }).showToast();

      if(data.status === "success"){
        setTimeout(() => {
          window.location.href = "/subscription_plans/";
        }, 1200);
      }
    }catch(err){
      Toastify({
        text: "Something went wrong. Please try again.",
        duration: 3000,
        gravity: "top",
        position: "right",
        backgroundColor: "#dc3545",
        close: true,
      }).showToast();
    }
  });
</script>
{% endblock %}
