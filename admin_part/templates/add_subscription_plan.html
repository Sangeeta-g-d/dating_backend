{% extends 'admin_base.html' %}
{% load static %}
{% block content %}
<div class="page-inner">
  <div class="card border-0 shadow-sm rounded-3 mt-4">
    <div class="card-header bg-primary text-white">
      <h4 class="mb-0"><i class="fas fa-plus-circle me-2"></i>Add Subscription Plan</h4>
    </div>
    <div class="card-body">
      <form id="subscriptionPlanForm">
        <!-- Plan Name -->
        <div class="mb-3">
          <label for="planName" class="form-label">Plan Name</label>
          <input type="text" class="form-control" id="planName" name="name" placeholder="Enter plan name" required>
        </div>

        <!-- Plan Type -->
        <div class="mb-3">
          <label for="planType" class="form-label">Plan Type</label>
          <select class="form-select" id="planType" name="plan_type" required>
            <option value="free">Free</option>
            <option value="premium">Premium</option>
          </select>
        </div>

        <!-- Price -->
        <div class="mb-3">
          <label for="price" class="form-label">Price (₹)</label>
          <input type="number" class="form-control" id="price" name="price" min="0" step="0.01" value="0">
        </div>

        <!-- Duration -->
        <div class="mb-3">
          <label for="durationDays" class="form-label">Duration (Days)</label>
          <input type="number" class="form-control" id="durationDays" name="duration_days" min="1" value="30" required>
        </div>

        <!-- Swipe Limit -->
        <div class="mb-3">
          <label for="swipeLimit" class="form-label">Daily Swipe Limit (Leave empty for unlimited)</label>
          <input type="number" class="form-control" id="swipeLimit" name="swipe_limit" min="1" placeholder="Unlimited if empty">
        </div>

        <!-- Features -->
        <div class="mb-3">
          <label class="form-label">Features</label>
          <div id="featuresWrapper">
            <div class="input-group mb-2 feature-item">
              <input type="text" class="form-control" name="features[]" placeholder="Enter feature" required>
              <button type="button" class="btn btn-danger btn-remove-feature"><i class="fas fa-trash"></i></button>
            </div>
          </div>
          <button type="button" class="btn btn-secondary btn-sm" id="addFeatureBtn"><i class="fas fa-plus me-1"></i>Add Feature</button>
        </div>

        <!-- Active Toggle -->
        <div class="form-check form-switch mb-3">
          <input class="form-check-input" type="checkbox" id="isActive" name="is_active" checked>
          <label class="form-check-label" for="isActive">Active</label>
        </div>

        <button type="submit" class="btn btn-primary w-100"><i class="fas fa-save me-2"></i>Save Plan</button>
      </form>
    </div>
  </div>
</div>

<!-- Toastify -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css">
<script src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
<script src="https://kit.fontawesome.com/a076d05399.js" crossorigin="anonymous"></script>

<script>
  // CSRF helper
  function getCookie(name) {
    let cookieValue = null;
    if (document.cookie && document.cookie !== '') {
      const cookies = document.cookie.split(';');
      for (let i = 0; i < cookies.length; i++) {
        const cookie = cookies[i].trim();
        if (cookie.substring(0, name.length + 1) === (name + '=')) {
          cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
          break;
        }
      }
    }
    return cookieValue;
  }

  // Add / Remove Features dynamically
  document.getElementById("addFeatureBtn").addEventListener("click", function () {
    const wrapper = document.getElementById("featuresWrapper");
    const div = document.createElement("div");
    div.classList.add("input-group", "mb-2", "feature-item");
    div.innerHTML = `
      <input type="text" class="form-control" name="features[]" placeholder="Enter feature" required>
      <button type="button" class="btn btn-danger btn-remove-feature"><i class="fas fa-trash"></i></button>
    `;
    wrapper.appendChild(div);
  });

  document.addEventListener("click", function(e){
    if(e.target.closest(".btn-remove-feature")){
      e.target.closest(".feature-item").remove();
    }
  });

  // Handle form submission via AJAX
  document.getElementById("subscriptionPlanForm").addEventListener("submit", async function(e){
    e.preventDefault();
    const formData = new FormData(this);

    try{
      const response = await fetch("", {
        method: "POST",
        headers: {
          "X-CSRFToken": getCookie("csrftoken"),
          "X-Requested-With": "XMLHttpRequest",
        },
        body: formData,
      });

      const data = await response.json();

      Toastify({
        text: data.message,
        duration: 3000,
        gravity: "top",
        position: "right",
        backgroundColor: data.status === "success" ? "#198754" : "#dc3545",
        close: true,
      }).showToast();

      if(data.status === "success"){
        this.reset();
        // Reset features to 1 input
        const wrapper = document.getElementById("featuresWrapper");
        wrapper.innerHTML = `<div class="input-group mb-2 feature-item">
          <input type="text" class="form-control" name="features[]" placeholder="Enter feature" required>
          <button type="button" class="btn btn-danger btn-remove-feature"><i class="fas fa-trash"></i></button>
        </div>`;
      }

    }catch(err){
      Toastify({
        text: "Something went wrong. Please try again.",
        duration: 3000,
        gravity: "top",
        position: "right",
        backgroundColor: "#dc3545",
        close: true,
      }).showToast();
    }
  });
</script>
{% endblock %}
