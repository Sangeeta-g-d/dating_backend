{% extends 'admin_base.html' %}
{% block content %}

<div class="page-inner">

  <!-- Header -->
  <div class="d-flex align-items-left align-items-md-center flex-column flex-md-row pt-2 pb-4">
    <div>
      <h3 class="fw-bold mb-3">Chat screen background</h3>
    </div>
    <div class="ms-md-auto py-2 py-md-0">
      <a href="#" class="btn btn-primary btn-round" data-bs-toggle="modal" data-bs-target="#addBackgroundModal">
        <i class="fas fa-plus me-2"></i>Add Background
      </a>
    </div>
  </div>


  <!-- EXISTING BACKGROUNDS -->
  <div class="row">
    {% for bg in backgrounds %}
      <div class="col-md-3 mb-4">
        <div class="card shadow-sm">
          <img src="{{ bg.image.url }}" class="card-img-top" style="height:180px; object-fit: cover;">
          <div class="card-body p-2">
            <h6 class="text-center">{{ bg.name }}</h6>
          </div>
        </div>
      </div>
    {% empty %}
      <p>No backgrounds added yet.</p>
    {% endfor %}
  </div>

</div>


<!-- ADD BACKGROUND MODAL -->
<div class="modal fade" id="addBackgroundModal" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">

      <form method="POST" enctype="multipart/form-data">
        {% csrf_token %}
        <div class="modal-header">
          <h5 class="modal-title">Add Chat Background</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>

        <div class="modal-body">

          <div class="mb-3">
            <label class="form-label">Background Name</label>
            <input type="text" class="form-control" name="name" required />
          </div>

          <div class="mb-3">
            <label class="form-label">Background Image</label>
            <input type="file" class="form-control" name="image" accept="image/*" required />
          </div>

        </div>

        <div class="modal-footer">
          <button type="submit" class="btn btn-primary">Save</button>
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
        </div>

      </form>

    </div>
  </div>
</div>

{% endblock %}
